
name: Build MuAutoReset

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build project
        shell: pwsh
        run: |
          msbuild .\MuAutoReset.csproj /restore /p:Configuration=Release /p:Platform=x86

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MuAutoReset-Release
          path: |
            bin/Release/**/*.exe
            bin/Release/**/*.dll
            bin/Release/**/*.json
          if-no-files-found: warn
